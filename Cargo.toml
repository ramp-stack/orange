[package]
name = "orange"
version = "1.0.1"
edition = "2024"
default-run = "orange"

[dependencies]
ramp = {package = "ramp2", version = "3.0.3"}
chk = {version = "2.0.0", git = "https://github.com/ramp-stack/chk"}

include_dir = "0.7.4"

[lib]
name="main"
crate-type=["staticlib", "cdylib", "rlib"]

[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.yazi]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3

[package.metadata.piston.ios]
team = "RYYG6X8WK7"
bundle_id = "org.ramp.orange"
minimum_os = "17.0"
info_plist = "ios/Info.plist"
resources = ["ios/LaunchScreen.storyboard", "ios/wordmark.png"]
build_number = "25"

[package.metadata.piston.notifications]
enabled = true

[package.metadata.piston.macos]
team = "RYYG6X8WK7"

[package.metadata.piston.developer]
team = "RYYG6X8WK7"
identity = "023c8a09189d12e0755e224a9e8a6af15b21186758aef12e65b0231757dd3bdee0"
