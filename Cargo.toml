[package]
name = "orange"
version = "1.0.0"
edition = "2024"
default-run = "orange"

[dependencies]
ramp = {package = "ramp2", path = "../ramp"}
chk = {path = "../chk"}

anyhow = "1"
serde = { version = "1", features = ["derive"] }
bitcoin = "0.32"
bdk_wallet = "3"
bdk_esplora = { version = "0.22", features = ["blocking"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
chrono = "0.4.44"
unified_uri = "0.1.0"
include_dir = "0.7.4"

[lib]
name="main"
crate-type=["staticlib", "cdylib", "rlib"]

[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.yazi]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3

[patch.crates-io]
prism2 = {path = "../prism"}
prism_proc = {path = "../prism/prism_proc"}
wgpu_prism = {path = "../wgpu_prism"}

[patch."https://github.com/ramp-stack/pelican_ui"]
pelican_ui = {path = "../pelican_ui"}

[patch."https://github.com/ramp-stack/ptsd"]
ptsd2 = {path = "../ptsd"}

[package.metadata.piston.ios]
team = "RYYG6X8WK7"
bundle_id = "org.ramp.orange"
minimum_os = "17.0"
