[package]
name = "orange"
version = "1.0.0"
edition = "2024"
default-run = "orange"

[dependencies]
ramp = {package = "ramp2", version = "3.0.3"}
chk = {path = "../chk"}

anyhow = "1"
serde = { version = "1", features = ["derive"] }
bitcoin = "0.32"
bdk_wallet = "3"
bdk_esplora = { version = "0.22", features = ["blocking"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
chrono = "0.4.44"
unified_uri = "0.1.0"
include_dir = "0.7.4"

[lib]
name="main"
crate-type=["staticlib", "cdylib", "rlib"]

# Published Ramp 3 with iOS focus-transfer and frame-presentation fixes.
[patch.crates-io]
ramp2 = { path = "vendor/ramp2" }

[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.yazi]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3

[package.metadata.piston.ios]
team = "RYYG6X8WK7"
bundle_id = "org.ramp.orange"
minimum_os = "17.0"
info_plist = "ios/Info.plist"
resources = ["ios/OrangeLaunchScreen.storyboard", "ios/OrangeLaunchWordmark.png"]
build_number = "27"

[package.metadata.piston.notifications]
enabled = true

