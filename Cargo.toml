[package]
name = "orange"
version = "0.1.0"
edition = "2024"

[dependencies]
ramp = {package = "ramp2", version = "1.0.0"}
chk = {version = "1.1.0", git = "https://github.com/ramp-stack/chk"}

anyhow = "1"
serde = { version = "1", features = ["derive"] }
bitcoin = "0.32"
bdk_wallet = "3"
bdk_esplora = { version = "0.22", features = ["blocking"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
chrono = "0.4.44"
unified_uri = "0.1.0"
include_dir = "0.7.4"

[lib]
name="main"
crate-type=["staticlib", "cdylib", "rlib"]

[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.yazi]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
