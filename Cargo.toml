[package]
name = "orange"
version = "1.0.1"
edition = "2024"
default-run = "orange"

[dependencies]
ramp = {package = "ramp2", version = "3.0.4"}
chk = {version = "2.0.0", git = "https://github.com/ramp-stack/chk", rev = "2da2ba12e6973c17ffa7d8e70dc218d342552fdf"}

include_dir = "0.7.4"
async-channel = "2.5"
futures = "0.3"

# Desktop CLI only. The iOS/Android GUI lib does not link these.
[target.'cfg(not(any(target_os = "ios", target_os = "android", target_arch = "wasm32")))'.dependencies]
air = "4.0.1"
air_server = "2.0.1"
base64 = "0.22"
chrono = "0.4"
crossfire = "3.1"
media = { package = "media2", version = "0.1.1" }
pelican_ui = { version = "3.0.0", git = "https://github.com/ramp-stack/pelican_ui", rev = "4522d2919738a6e042faa530c3f04f8bca66a5cf" }
postcard = { version = "1.1.3", features = ["alloc"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
ureq = { version = "2.12", features = ["json"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSUserActivity", "NSURL", "NSDictionary", "NSString"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIResponder"] }

[lib]
name="main"
crate-type=["staticlib", "cdylib", "rlib"]

[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.yazi]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3

[package.metadata.piston.ios]
team = "RYYG6X8WK7"
bundle_id = "org.ramp.orange"
minimum_os = "17.0"
info_plist = "ios/Info.plist"
entitlements = "ios/Orange.entitlements"
resources = ["ios/OrangeLaunchScreen.storyboard", "ios/OrangeLaunchWordmark.png"]
build_number = "29"

[package.metadata.piston.notifications]
enabled = true

